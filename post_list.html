<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Postlar - Ro'yxat</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen text-slate-100 py-10 px-4">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-10 bg-white/5 backdrop-blur-md p-6 rounded-2xl border border-white/10 shadow-2xl">
            <div>
                <h1 class="text-3xl font-extrabold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">Mening Blogim</h1>
                <p id="server-message" class="text-slate-400 text-sm mt-1">Server bilan bog'lanilmoqda...</p>
            </div>
            <div class="bg-indigo-600/30 border border-indigo-500/30 px-4 py-2 rounded-xl text-center">
                <span class="block text-xs text-indigo-300 uppercase tracking-wider font-semibold">Jami postlar</span>
                <span id="post-count" class="text-2xl font-bold text-white">0</span>
            </div>
        </header>

        <!-- Posts Grid Container -->
        <main id="posts-container" class="grid gap-6">
            <!-- Dinamik ravishda postlar shu yerga qo'shiladi -->
            <div class="text-center py-12 text-slate-400">Yuklanmoqda...</div>
        </main>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8000/api/posts/';

        async function fetchPosts() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();

                if(result.status === 200) {
                    document.getElementById('server-message').textContent = result.message;
                    document.getElementById('post-count').textContent = result.data.count;

                    const container = document.getElementById('posts-container');
                    container.innerHTML = '';

                    result.data.posts.forEach(post => {
                        // Sanani chiroyliformatga o'tkazish
                        const date = new Date(post.created_at).toLocaleString('uz-UZ');

                        const card = document.createElement('div');
                        card.className = "bg-white/5 backdrop-blur-xl border border-white/10 p-6 rounded-2xl shadow-xl hover:border-indigo-500/50 transition duration-300 group";
                        card.innerHTML = `
                            <div class="flex justify-between items-start gap-4 mb-3">
                                <span class="text-xs font-mono bg-indigo-500/20 text-indigo-300 px-3 py-1 rounded-full border border-indigo-500/30">
                                    ID: ${post.id.slice(0, 8)}...
                                </span>
                                <span class="text-xs text-slate-400">${date}</span>
                            </div>
                            <p class="text-slate-200 text-lg leading-relaxed mb-4 group-hover:text-white transition">
                                ${post.content}
                            </p>
                            <div class="flex justify-end">
                                <a href="post_detail.html?id=${post.id}" class="inline-flex items-center gap-2 text-sm font-semibold text-indigo-400 hover:text-indigo-300 transition">
                                    Batafsil o'qish
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                                </a>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                }
            } catch (error) {
                console.error('Xatolik:', error);
                document.getElementById('posts-container').innerHTML = `
                    <div class="bg-red-500/10 border border-red-500/20 text-red-400 p-6 rounded-2xl text-center">
                        Serverga ulanishda xatolik yuz berdi! Iltimos, Django serveri yoniqligini tekshiring.
                    </div>
                `;
            }
        }

        fetchPosts();
    </script>
</body>
</html>
